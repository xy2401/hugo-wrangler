<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found - {{ .Site.Title }}</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #f97316; }
  </style>
</head>
<body>
  <div>
    <h1>404 - 页面不存在</h1>
    <p>该 404 页面由 Hugo 生成，并通过 <code>wrangler.jsonc</code> 的 <code>not_found_handling: "404-page"</code> 提供服务。</p>
    <p><a href="/">返回首页</a></p>
  </div>
</body>
</html>
